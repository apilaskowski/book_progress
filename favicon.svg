<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background squircle container -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- Open Book Icon -->
  <g filter="url(#shadow)">
    <!-- Back Cover Base -->
    <path d="M10 47C17 44 26 44 32 47C38 44 47 44 54 47V20C47 17 38 17 32 20C26 17 17 17 10 20Z" fill="url(#cover)"/>
    <!-- Left Pages Block -->
    <path d="M12 18.5C18 16 26 16 31 18.5V43.5C26 41 18 41 12 43.5Z" fill="url(#pages)"/>
    <!-- Right Pages Block -->
    <path d="M33 18.5C38 16 46 16 52 18.5V43.5C46 41 38 41 33 43.5Z" fill="url(#pages)"/>
    <!-- Subtle page text lines -->
    <line x1="16" y1="23" x2="27" y2="23" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="27" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="33" x2="24" y2="33" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="23" x2="48" y2="23" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="28" x2="48" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="33" x2="44" y2="33" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Spine divider -->
    <line x1="32" y1="18.5" x2="32" y2="44.5" stroke="#334155" stroke-width="1.2"/>
    <!-- Bookmark Ribbon -->
    <path d="M30 17V27L32 25L34 27V17" fill="url(#ribbon)"/>
  </g>
</svg>
